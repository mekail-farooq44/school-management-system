<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Classes - School Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <div class="page-header">
      <h1>Classes</h1>
      <button class="btn" id="addClassBtn" style="display:none;">+ Add Class</button>
    </div>

    <div class="card">
      <div id="tableWrapper">
        <table>
          <thead>
            <tr>
              <th>Class</th>
              <th>Section</th>
              <th>Academic Year</th>
              <th>Class Teacher</th>
              <th id="actionsHeader" style="display:none;">Actions</th>
            </tr>
          </thead>
          <tbody id="classesTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">No classes found.</div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="classModal">
    <div class="modal">
      <h2 id="modalTitle">Add Class</h2>
      <form id="classForm">
        <input type="hidden" id="classId">
        <div class="form-row">
          <div class="form-group">
            <label>Class Name</label>
            <input type="text" id="name" placeholder="e.g. Grade 5" required>
          </div>
          <div class="form-group">
            <label>Section</label>
            <input type="text" id="section" placeholder="e.g. A" required>
          </div>
        </div>
        <div class="form-group">
          <label>Academic Year</label>
          <input type="text" id="academicYear" placeholder="e.g. 2026">
        </div>
        <div class="form-group">
          <label>Class Teacher</label>
          <select id="classTeacher">
            <option value="">-- None --</option>
          </select>
        </div>

        <div class="error-msg" id="modalError"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/classes.js"></script>
</body>
</html>
