<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - School Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="subtitle">Register a new account for School Management System</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@school.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role">
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
          </select>
        </div>
        <button type="submit" class="btn btn-block">Create Account</button>
      </form>

      <p class="footer-link">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
