<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teachers - School Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="container">
    <div class="page-header">
      <h1>Teachers</h1>
      <button class="btn" id="addTeacherBtn" style="display:none;">+ Add Teacher</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by name or subject...">
        <button class="btn btn-secondary btn-sm" id="searchBtn">Search</button>
      </div>

      <div id="tableWrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Subject</th>
              <th>Assigned Classes</th>
              <th id="actionsHeader" style="display:none;">Actions</th>
            </tr>
          </thead>
          <tbody id="teachersTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">No teachers found.</div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="teacherModal">
    <div class="modal">
      <h2 id="modalTitle">Add Teacher</h2>
      <form id="teacherForm">
        <input type="hidden" id="teacherId">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" required>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="phone">
          </div>
          <div class="form-group">
            <label>Subject Specialization</label>
            <input type="text" id="subjectSpecialization" placeholder="e.g. Mathematics">
          </div>
        </div>
        <div class="form-group">
          <label>Qualification</label>
          <input type="text" id="qualification" placeholder="e.g. M.Ed">
        </div>
        <div class="form-group">
          <label>Assigned Classes (comma-separated)</label>
          <input type="text" id="assignedClasses" placeholder="e.g. Grade 5-A, Grade 6-B">
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address">
        </div>

        <div class="error-msg" id="modalError"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
